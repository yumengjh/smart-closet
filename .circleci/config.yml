# Required checks on every push and pull request (replaces .github/workflows/frontend.yml).
version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:24.10
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths: [~/.npm]
      - run: npm test
      - run: npm run typecheck
      - run:
          name: Build real API frontend
          environment:
            VITE_USE_MOCKS: "false"
            VITE_API_BASE_URL: ""
          command: npm run build

workflows:
  checks:
    jobs:
      - verify
