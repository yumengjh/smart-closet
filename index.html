<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="鱼搭，整理衣物、管理衣柜与组合穿搭。" />
    <link rel="icon" type="image/png" href="/yuda-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="鱼搭" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>鱼搭 · 数字衣柜</title>
    <script>
      try {
        const theme = localStorage.getItem('yuda.theme.v1') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#191c23' : '#f7f8fa')
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
