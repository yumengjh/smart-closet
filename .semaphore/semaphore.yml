# Archived backup: all automatic blocks/promotions are disabled.
# GitHub Actions owns checks and checked version-tag releases (#138, 2026-11-05).
# Manual backup deployment requires stopping the corresponding Actions deployment first.
version: v1.0
name: Checks
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

# A newer push replaces the running check on a branch; main and tags always finish.
auto_cancel:
  running:
    when: "branch != 'main' AND tag !~ '.*'"
  queued:
    when: "branch != 'main' AND tag !~ '.*'"

execution_time_limit:
  minutes: 20

blocks:
  - name: Verify
    skip:
      when: "true"
    task:
      jobs:
        - name: test, typecheck, build
          commands:
            - checkout
            - sem-version node 24
            - cache restore npm-$(checksum package-lock.json)
            - npm audit --package-lock-only --ignore-scripts --audit-level=high
            - npm ci
            - cache store npm-$(checksum package-lock.json) ~/.npm
            - npm test
            - npm run typecheck
            - VITE_USE_MOCKS=false VITE_API_BASE_URL="" npm run build

promotions:
  - name: Deploy this commit
    pipeline_file: deploy.yml
    auto_promote:
      when: "false"
