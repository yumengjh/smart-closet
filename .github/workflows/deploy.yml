name: Deploy frontend

# Called by frontend.yml after successful tag checks, or run manually.
# Running this workflow by hand tests and builds the site, then replaces every file in the site directory on
# the web server over SSH (1Panel static site; DEPLOY_PATH and DEPLOY_SITE_URL come from secrets). No container involved.
# Settings: repository secrets (Settings → Secrets and variables → Actions).
on:
  workflow_call:
    inputs:
      validate_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      validate_only:
        description: "只检查部署配置，不连接服务器或部署"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  check-config:
    name: Check deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secret presence
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SITE_URL: ${{ secrets.DEPLOY_SITE_URL }}
        run: |
          missing=()
          [ -n "$SSH_HOST" ] || missing+=(DEPLOY_SSH_HOST)
          [ -n "$SSH_USER" ] || missing+=(DEPLOY_SSH_USER)
          [ -n "$KNOWN_HOSTS" ] || missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [ -n "$SSH_KEY$SSH_PASSWORD" ] || missing+=("DEPLOY_SSH_KEY 或 DEPLOY_SSH_PASSWORD")
          [ -n "$DEPLOY_PATH" ] || missing+=(DEPLOY_PATH)
          [ -n "$SITE_URL" ] || missing+=(DEPLOY_SITE_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing deployment configuration: %s\n' "${missing[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          case "$DEPLOY_PATH" in /*/*/*) ;; *) echo 'DEPLOY_PATH is too short'; exit 1 ;; esac
          echo 'Required deployment configuration is present (values hidden; connectivity not tested).' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build and deploy site
    needs: check-config
    if: inputs.validate_only != true
    runs-on: ubuntu-latest
    # Build ~2 min plus a 25-minute upload budget.
    timeout-minutes: 35
    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SITE_URL: ${{ secrets.DEPLOY_SITE_URL }}
      API_BASE: ${{ secrets.FRONTEND_API_BASE_URL }}
    steps:
      # The site only works if its API answers: FRONTEND_API_BASE_URL (a separate API host, which must allow this site in
      # the backend's CLOSET_CORS_ALLOWED_ORIGINS), or, when empty, a reverse proxy for /api on the site's own domain.
      # Checked before building, so a site that cannot reach the backend is never deployed.
      - name: Check the API the site will call
        run: |
          set -uo pipefail
          if [ -n "$API_BASE" ]; then
            case "$API_BASE" in https://*) ;; *) echo "FRONTEND_API_BASE_URL 必须是 https:// 开头的后端地址（不带路径）：$API_BASE"; exit 1 ;; esac
            api="${API_BASE%/}"; how="FRONTEND_API_BASE_URL"
          else
            api="$(printf '%s' "$SITE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"; how="站点同域的 /api 反向代理"
          fi
          body=$(curl -sS -m 20 -H 'Accept: application/json' "$api/api/health" || true)
          if printf '%s' "$body" | grep -q '"status" *: *"UP"'; then echo "API 可用（$how）：$api/api/health → $body"; exit 0; fi
          echo "::error::$api/api/health 没有返回后端健康检查（收到：$(printf '%s' "$body" | tr -s '\n ' ' ' | head -c 100)）"
          if [ -z "$API_BASE" ]; then
            echo "未设置 FRONTEND_API_BASE_URL，页面会请求 $api/api，但该域名没有把 /api 转发到后端。二选一："
            echo "  1. 在仓库 secrets 里设置 FRONTEND_API_BASE_URL=后端的 https 地址，并在后端 .env 的 CLOSET_CORS_ALLOWED_ORIGINS 加入 ${api}"
            echo "  2. 在 1Panel 给站点加反向代理：/api → 后端地址（同域，无需 CORS）"
          fi
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          VITE_USE_MOCKS: "false"
          # Empty: the site calls /api on its own domain (reverse proxy). Set FRONTEND_API_BASE_URL for a separate API host.
          VITE_API_BASE_URL: ${{ secrets.FRONTEND_API_BASE_URL }}
          # Shown at the bottom of Settings: the tag (v1.2.0 → 1.2.0) on a tag build, else package.json's version.
          CLOSET_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          npm run build
          test -s dist/index.html
          tar -C dist -czf site.tar.gz .
          sha256sum dist/index.html | awk '{print $1}' > index.sha256
          echo "构建完成：$(find dist -type f | wc -l) 个文件，$(du -sh dist | cut -f1)"

      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          port=${SSH_PORT:-22}
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$port" -T 15 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null; echo "::warning::未设置 DEPLOY_SSH_KNOWN_HOSTS，本次信任扫描到的主机指纹"; fi
          # IPQoS=none: on 2026-11-24 two uploads from GitHub's runners connected fine and then never moved a byte, while
          # the same scp from Semaphore to the same host finished in seconds; DSCP-marked bulk packets dropped on the route
          # is the usual cause of that pattern. Keep-alives end a dead connection instead of waiting for the job timeout.
          opts=(-p "$port" -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=20 -o IPQoS=none -o StrictHostKeyChecking=yes)
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
            opts+=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes); pre=""
          else
            sudo apt-get install -y -qq sshpass >/dev/null
            pre="sshpass -e"; opts+=(-o PubkeyAuthentication=no)
          fi
          printf '#!/usr/bin/env bash\nexec %s ssh %s "%s@%s" "$@"\n' "$pre" "${opts[*]}" "$SSH_USER" "$SSH_HOST" > ~/remote && chmod +x ~/remote
          printf '#!/usr/bin/env bash\nexec %s scp %s "$@"\n' "$pre" "${opts[*]/-p/-P}" > ~/upload && chmod +x ~/upload
          printf '#!/usr/bin/env bash\nexec %s ssh %s "$@"\n' "$pre" "${opts[*]}" > ~/rsh && chmod +x ~/rsh
          ~/remote 'echo "已连接 $(hostname)"'

      # The route from GitHub's runners to the host is slow (2026-11-24: about 14 KB/s, 4 MB of a 15.6 MB package per
      # 5 minutes), so only what changed crosses it: the host copies the live site into a staging directory, then rsync
      # compares contents (-c) and sends the changed files, resuming after a dropped connection (--partial) until a
      # 25-minute budget runs out. Hashed bundles and the pose model rarely change. Hosts without rsync get the whole
      # package in up to three 5-minute attempts. The live site is untouched until "Replace site files".
      - name: Upload site files
        run: |
          # Actions runs steps with bash -e; the retry loops handle failures themselves.
          set +e -uo pipefail
          stage="/tmp/yuda-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          qstage=$(printf %q "$stage"); qtarget=$(printf %q "$DEPLOY_PATH")
          echo "DEPLOY_STAGE=$stage" >> "$GITHUB_ENV"
          echo "本次构建：$(find dist -type f | wc -l) 个文件，$(du -sk dist | cut -f1) KiB"
          if timeout 30 ~/remote 'command -v rsync' >/dev/null; then
            echo "DEPLOY_MODE=dir" >> "$GITHUB_ENV"
            timeout 120 ~/remote "rm -rf $qstage && mkdir -p $qstage && { cp -R $qtarget/. $qstage/ 2>/dev/null; rm -f $qstage/.user.ini; true; }"
            deadline=$((SECONDS + 1500)); attempt=0
            while [ $SECONDS -lt $deadline ]; do
              attempt=$((attempt + 1)); start=$SECONDS
              timeout $((deadline - SECONDS)) rsync -rlcz --partial --delete --timeout=60 --stats -e ~/rsh dist/ "$SSH_USER@$SSH_HOST:$stage/" > rsync.log 2>&1
              code=$?
              grep -E "Number of regular files transferred|Total transferred file size|Total bytes sent" rsync.log
              if [ "$code" = 0 ]; then echo "第 $attempt 次同步完成（$((SECONDS - start)) 秒）"; exit 0; fi
              echo "::warning::第 $attempt 次同步中断（退出码 $code，用时 $((SECONDS - start)) 秒），接着断点续传"
              tail -n 3 rsync.log; sleep 5
            done
            timeout 30 ~/remote "rm -rf $qstage" || true
            echo "::error::25 分钟内没有同步完，站点没有改动。上面的统计是每次已传的字节数。"
            exit 1
          fi
          echo "::warning::主机没有 rsync，改为整包上传"
          echo "DEPLOY_MODE=archive" >> "$GITHUB_ENV"
          tmp="$stage.tar.gz"; qtmp=$(printf %q "$tmp")
          size=$(stat -c %s site.tar.gz); want=$(sha256sum site.tar.gz | awk '{print $1}')
          echo "上传 site.tar.gz：$((size / 1024)) KiB，sha256 ${want:0:12}"
          for attempt in 1 2 3; do
            start=$SECONDS
            if [ "$attempt" = 2 ]; then
              how="ssh 流式"; timeout 300 ~/remote "cat > $qtmp" < site.tar.gz
            else
              how="scp"; timeout 300 ~/upload site.tar.gz "$SSH_USER@$SSH_HOST:$tmp"
            fi
            code=$?
            read -r got_size got_sum < <(timeout 30 ~/remote "printf '%s %s\n' \"\$(stat -c %s $qtmp 2>/dev/null || echo 0)\" \"\$(sha256sum $qtmp 2>/dev/null | cut -d' ' -f1)\"" || echo "? ?")
            if [ "$got_sum" = "$want" ]; then echo "第 $attempt 次上传成功（$how，$((SECONDS - start)) 秒）"; exit 0; fi
            echo "::warning::第 $attempt 次上传失败（$how，退出码 $code，用时 $((SECONDS - start)) 秒，主机收到 ${got_size:-?} / $size 字节）"
            sleep 10
          done
          timeout 30 ~/remote "rm -f $qtmp" || true
          echo "::error::三次上传都没有完成，站点没有改动。主机收到的字节数见上面的提醒，可据此判断是线路慢还是完全不通。"
          exit 1

      - name: Replace site files
        run: |
          set -euo pipefail
          ~/remote "bash -s -- $(printf %q "$DEPLOY_PATH") $(printf %q "$DEPLOY_STAGE") $(printf %q "$DEPLOY_MODE")" <<'REMOTE'
          set -euo pipefail
          target=$1; upload=$2; mode=$3
          trap 'rm -rf "$upload" "$upload.tar.gz"' EXIT
          [ -d "$target" ] || { echo "站点目录不存在：$target"; exit 1; }
          SUDO=(); [ -w "$target" ] || SUDO=(sudo -n)
          owner=$(stat -c '%u:%g' "$target")
          if [ "$mode" = archive ]; then
            # Unpack next to the site (same file system).
            stage=$("${SUDO[@]}" mktemp -d "$(dirname "$target")/.deploy-XXXXXX")
            "${SUDO[@]}" tar -xzf "$upload.tar.gz" -C "$stage"
          else
            stage=$upload
          fi
          [ -s "$stage/index.html" ] || { [ "$mode" = archive ] && "${SUDO[@]}" rm -rf "$stage"; echo "上传的内容里没有 index.html"; exit 1; }
          # Keep the previous version for a manual rollback.
          "${SUDO[@]}" tar -czf "$(dirname "$target")/.index-previous.tar.gz" -C "$target" . 2>/dev/null || true
          # Full overwrite: every old file goes, except 1Panel's protected .user.ini (chattr +i on PHP sites).
          if command -v rsync >/dev/null; then
            "${SUDO[@]}" rsync -rlc --delete --exclude .user.ini "$stage/" "$target/"
          else
            "${SUDO[@]}" find "$target" -mindepth 1 -maxdepth 1 ! -name .user.ini -exec rm -rf {} +
            "${SUDO[@]}" cp -R "$stage/." "$target/"
          fi
          "${SUDO[@]}" chown -R "$owner" "$target"
          [ "$mode" = archive ] && "${SUDO[@]}" rm -rf "$stage"
          echo "已覆盖 $target：$(find "$target" -type f | wc -l) 个文件；上一版备份在 $(dirname "$target")/.index-previous.tar.gz"
          REMOTE

      # Tencent Cloud CDN in front of the site: flush what changed at the origin (index.html, unhashed static files).
      # Needs secrets TENCENTCLOUD_SECRET_ID / TENCENTCLOUD_SECRET_KEY (CAM user with policy yuda-cdn-purge); skipped without them.
      - name: Refresh CDN cache
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          CDN_PURGE_PATHS: ${{ secrets.CDN_PURGE_PATHS }}
        run: node scripts/purge-cdn.mjs

      - name: Verify the live site
        run: |
          set -euo pipefail
          want=$(cat index.sha256)
          for _ in 1 2 3 4 5 6; do
            got=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL?deploy=$GITHUB_RUN_ID" | sha256sum | awk '{print $1}' || true)
            [ "$got" = "$want" ] && { echo "线上 $SITE_URL 已是本次构建"; exit 0; }
            sleep 5
          done
          echo "::warning::线上 index.html 与本次构建不一致（可能有 CDN 缓存，或 DEPLOY_SITE_URL 不对）"

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
