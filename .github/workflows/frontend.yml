name: Frontend checks

# Primary CI; only a checked version tag calls the deployment workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build Vue frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Audit locked dependencies
        run: |
          mkdir -p security-reports
          git rev-parse HEAD > security-reports/commit.txt
          npm audit --package-lock-only --ignore-scripts --audit-level=high --json > security-reports/npm-all.json
          npm audit --package-lock-only --ignore-scripts --omit=dev --audit-level=high --json > security-reports/npm-production.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-security-reports
          path: security-reports
          retention-days: 30
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build real API frontend
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_BASE_URL: ""
        run: npm run build

  deploy:
    name: Deploy checked version tag
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
