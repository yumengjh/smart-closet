name: Frontend checks

# Primary CI; only a checked version tag calls the deployment workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build Vue frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Audit locked dependencies
        run: |
          mkdir -p security-reports
          git rev-parse HEAD > security-reports/commit.txt
          # 只拦生产依赖：开发与构建工具（vite、vue-tsc 等）不进产物，其高危漏洞写进报告并提示，不让检查失败。
          # 起因：2026-11-18 picomatch（GHSA-fc5q-39xc-vjpf，<=4.0.7 无修复版）经 vite / vue-tsc 引入；上游修复后升级。
          npm audit --package-lock-only --ignore-scripts --audit-level=high --json > security-reports/npm-all.json \
            || echo "::warning title=开发依赖审计::开发或构建依赖有高危漏洞，详见 frontend-security-reports/npm-all.json"
          npm audit --package-lock-only --ignore-scripts --omit=dev --audit-level=high --json > security-reports/npm-production.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: frontend-security-reports
          path: security-reports
          retention-days: 30
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build real API frontend
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_BASE_URL: ""
        run: npm run build

  deploy:
    name: Deploy checked version tag
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
