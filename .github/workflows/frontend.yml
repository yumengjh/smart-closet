name: Frontend checks

# Everyday checks on pull requests to main, frugally: only when frontend code changed, and a newer push cancels the
# older run. Releases are tested again in deploy.yml.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build Vue frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build real API frontend
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_BASE_URL: ""
        run: npm run build
